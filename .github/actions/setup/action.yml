name: Setup
description: Install pnpm (version from package.json), Node, and dependencies with a warm store cache.

inputs:
  node-version:
    description: Node.js version. Defaults to the major production runs (nixpacks.toml).
    default: '22'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
