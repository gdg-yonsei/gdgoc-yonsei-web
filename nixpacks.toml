# 네이티브 pnpm은 Corepack 대신 npm으로 설치하며 packageManager에서 무결성 해시를 제외한 버전을 읽는다.
# Nix의 전역 npm 경로 대신 /opt/pnpm을 쓰고 모든 단계의 PATH에 추가한다.

# engines 범위의 자동 추론에 따라 Node 메이저가 바뀌지 않도록 고정한다.
# npm이 설치한 pnpm을 가리지 않도록 Nix의 pnpm 패키지는 제외한다.
[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
dependsOn = ["setup"]
paths = ["/opt/pnpm/bin", "..."]
cmds = [
  "npm install -g --prefix /opt/pnpm \"$(node -p \"require('./package.json').packageManager.split('+')[0]\")\"",
  "pnpm --version",
  "pnpm install --frozen-lockfile",
]
cacheDirectories = [
  "/root/.local/share/pnpm/store",
  ".next/cache",
]

# 정적 경로가 새 스키마를 읽으므로 배포 빌드는 CI에서 검증한 마이그레이션을 먼저 적용한다.
# 로컬 `pnpm build`는 DB 스키마를 변경하지 않는다.
[phases.build]
dependsOn = ["install"]
cmds = ["pnpm build:production"]
