# Nixpacks가 자동 생성하는 install 단계는 corepack@0.24.1을 고정 설치한다.
# 이 버전은 pnpm 11의 엔트리(bin/pnpm.cjs, 최상위 동적 import)를 vm 컨텍스트에서
# 로드하다 ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING으로 죽는다.
# package.json의 packageManager는 pnpm@11.20.0이므로 corepack을 최신 계열로 올려 설치한다.
#
# pnpm 9(setup 단계의 nix 패키지)로 낮추는 것은 대안이 아니다.
# pnpm-workspace.yaml이 overrides / allowBuilds / minimumReleaseAgeExclude 등
# pnpm 10+ 전용 필드를 사용하고 있어 pnpm 9는 이를 조용히 무시한다.
#
# corepack 버전은 0.34.0으로 고정한다. 빌드 이미지의 Node는 22.14.0인데
# 최신인 0.35.0은 engines가 "^22.22.2 || ^24.15.0 || >=26.0.0"이라 이 Node를 지원하지 않는다.
# 0.34.0의 engines는 "^20.10.0 || ^22.11.0 || >=24.0.0"으로 22.14.0을 포함한다.

[variables]
# 비대화형(TTY 없음) 빌드에서 corepack 다운로드 프롬프트가 끼어들지 않도록 한다.
COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"

# Node는 명시적으로 고정한다. engines.node를 ">=22.13.0 <=24"로 올렸기 때문에
# nixpacks의 자동 추론에 맡기면 선택되는 메이저가 달라질 수 있다.
# pnpm은 corepack이 공급하므로 nix의 pnpm-9_x는 넣지 않는다(PATH 섀도잉 방지).
[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
dependsOn = ["setup"]
cmds = [
  "npm install -g corepack@0.34.0",
  "corepack enable",
  "pnpm install --frozen-lockfile",
]
cacheDirectories = [
  "/root/.local/share/pnpm/store/v3",
  "/root/.cache/node/corepack",
  ".next/cache",
]
