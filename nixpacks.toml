# Corepack 0.34.0은 bin/pnpm.cjs를 실행하지만 pnpm 12는 네이티브 실행 파일을 사용한다.
# npm이 패키지의 bin과 플랫폼별 의존성을 설치하도록 Corepack 대신 pnpm을 직접 설치한다.
# 버전은 package.json의 packageManager에서 읽고 Corepack용 무결성 해시(+sha512...)만 제거한다.
# --force는 빌드 이미지에 Corepack shim이 남아 있어도 pnpm 실행 파일로 교체하기 위한 옵션이다.

# Node는 명시적으로 고정한다. engines.node를 ">=22.13.0 <=24"로 올렸기 때문에
# nixpacks의 자동 추론에 맡기면 선택되는 메이저가 달라질 수 있다.
# pnpm은 npm이 공급하므로 nix의 pnpm-9_x는 넣지 않는다(PATH 섀도잉 방지).
[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
dependsOn = ["setup"]
cmds = [
  "npm install -g --force \"$(node -p \"require('./package.json').packageManager.split('+')[0]\")\"",
  "pnpm --version",
  "pnpm install --frozen-lockfile",
]
cacheDirectories = [
  "/root/.local/share/pnpm/store",
  ".next/cache",
]

# 배포 빌드만 마이그레이션을 적용한다. `pnpm build`는 DB 스키마를 건드리지 않으므로 로컬에서 운영 DB를
# 가리키는 `.env`로 빌드해도 마이그레이션이 적용되지 않는다. 마이그레이션이 `next build`보다 먼저인 이유:
# 빌드가 정적 경로를 만들려고 새 스키마로 DB를 읽는다. CI의 "Migration upgrade path" 작업이 같은
# `drizzle-kit migrate`를 운영과 같은 상태의 DB에 실행해 본다.
[phases.build]
dependsOn = ["install"]
cmds = ["pnpm build:production"]
