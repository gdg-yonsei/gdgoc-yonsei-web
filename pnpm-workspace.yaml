allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
overrides:
  '@types/react': $@types/react
  '@types/react-dom': $@types/react-dom
  # 개발 도구의 취약한 전이 의존성을 패치판으로 고정한다: next >=16.2.11, postcss >=8.5.23.
  # sharp >=0.35.0, 폐기된 @esbuild-kit 경유 esbuild >=0.24.3도 같은 이유로 고정한다.
  next: $next
  postcss: $postcss
  sharp: $sharp
  esbuild: 0.28.1
minimumReleaseAgeExclude:
  - '@aws-sdk/checksums@3.1000.26'
  - '@aws-sdk/client-s3@3.1103.0'
  - '@aws-sdk/core@3.977.6'
  - '@aws-sdk/credential-provider-env@3.972.67'
  - '@aws-sdk/credential-provider-http@3.972.69'
  - '@aws-sdk/credential-provider-ini@3.973.12'
  - '@aws-sdk/credential-provider-login@3.972.74'
  - '@aws-sdk/credential-provider-node@3.972.78'
  - '@aws-sdk/credential-provider-process@3.972.67'
  - '@aws-sdk/credential-provider-sso@3.973.11'
  - '@aws-sdk/credential-provider-web-identity@3.972.73'
  - '@aws-sdk/middleware-sdk-s3@3.972.72'
  - '@aws-sdk/nested-clients@3.997.41'
  - '@aws-sdk/s3-request-presigner@3.1103.0'
  - '@aws-sdk/token-providers@3.1103.0'
  - '@next/env@16.3.6'
  - '@next/eslint-plugin-next@16.3.6'
  - '@next/playwright@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - '@next/third-parties@16.3.6'
  - eslint-config-next@16.3.6
  - next@16.3.6
  - resend@6.29.0
  - '@redis/time-series@6.3.0'
