allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
overrides:
  '@types/react': 19.2.2
  '@types/react-dom': 19.2.2
  # 아래 네 개는 전이 의존성으로만 들어오는 취약 버전을 패치판으로 끌어올린다.
  # 모두 개발 전용 경로(@react-email/preview-server, drizzle-kit)에서 나왔고,
  # 앱 런타임이 직접 쓰는 버전은 이미 안전하다.
  #   next     16.1.7  -> GHSA 다수 (패치 >=16.2.11)
  #   postcss   8.4.31 -> GHSA-fxqj-rqcc-2cmp 외 (패치 >=8.5.23)
  #   sharp     0.34.5 -> 패치 >=0.35.0
  #   esbuild   0.18.20 -> 패치 >=0.24.3, 폐기된 @esbuild-kit/* 경유
  next: 16.3.1
  postcss: 8.5.25
  sharp: 0.35.3
  esbuild: 0.28.1
minimumReleaseAgeExclude:
  - '@aws-sdk/checksums@3.1000.26'
  - '@aws-sdk/client-s3@3.1103.0'
  - '@aws-sdk/core@3.977.6'
  - '@aws-sdk/credential-provider-env@3.972.67'
  - '@aws-sdk/credential-provider-http@3.972.69'
  - '@aws-sdk/credential-provider-ini@3.973.12'
  - '@aws-sdk/credential-provider-login@3.972.74'
  - '@aws-sdk/credential-provider-node@3.972.78'
  - '@aws-sdk/credential-provider-process@3.972.67'
  - '@aws-sdk/credential-provider-sso@3.973.11'
  - '@aws-sdk/credential-provider-web-identity@3.972.73'
  - '@aws-sdk/middleware-sdk-s3@3.972.72'
  - '@aws-sdk/nested-clients@3.997.41'
  - '@aws-sdk/s3-request-presigner@3.1103.0'
  - '@aws-sdk/token-providers@3.1103.0'
  - '@next/env@16.3.1'
  - '@next/eslint-plugin-next@16.3.1'
  - '@next/playwright@16.3.1'
  - '@next/swc-darwin-arm64@16.3.1'
  - '@next/swc-darwin-x64@16.3.1'
  - '@next/swc-linux-arm64-gnu@16.3.1'
  - '@next/swc-linux-arm64-musl@16.3.1'
  - '@next/swc-linux-x64-gnu@16.3.1'
  - '@next/swc-linux-x64-musl@16.3.1'
  - '@next/swc-win32-arm64-msvc@16.3.1'
  - '@next/swc-win32-x64-msvc@16.3.1'
  - '@next/third-parties@16.3.1'
  - eslint-config-next@16.3.1
  - next@16.3.1
